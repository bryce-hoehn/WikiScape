name: Deploy with Codeberg Pages

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          
      - name: Setup Expo
        uses: https://github.com/expo/expo-github-action@v8
        with:
          expo-version: latest
          packager: npm

      - name: Install dependencies
        run: npm ci
       
      - name: Build website
        run: |
          npx expo export --platform web

      - name: Verify build output
        run: |
          ls -la dist/
          echo "Total files: $(find dist -type f | wc -l)"
          
      - name: Configure Git
        run: |
          git config --global user.name "codeberg-actions[bot]"
          git config --global user.email "codeberg-actions[bot]@users.noreply.codeberg.org"
    
      - name: Deploy to Codeberg Pages
        run: |
          cd dist
          git init
          git add .
          git commit -m "chore: rebuild static page"
          git remote add origin https://codeberg.org/bhoehn/WikiScape.git
          git push -u origin HEAD:pages --force